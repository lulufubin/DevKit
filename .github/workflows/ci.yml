name: CI

on:
  push:
    branches: [main, "cursor/**", "feature/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo check --manifest-path rust/Cargo.toml --locked
      - name: CLI encrypt/decrypt roundtrip
        shell: bash
        run: |
          WORK="${RUNNER_TEMP}/devkit-roundtrip"
          mkdir -p "$WORK"
          printf 'hello-devkit' > "$WORK/plain.txt"
          cargo run -p devkit-cli --locked -- encrypt --input "$WORK/plain.txt" --output "$WORK/plain.txt.age" --passphrase testpass
          cargo run -p devkit-cli --locked -- decrypt --input "$WORK/plain.txt.age" --output "$WORK/out.txt" --passphrase testpass
          diff "$WORK/plain.txt" "$WORK/out.txt"

  helpers:
    name: helper source tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: helpers/crypto-node/pnpm-lock.yaml
      - run: uv sync --project helpers/crypto-python
      - name: Install crypto-js
        working-directory: helpers/crypto-node
        run: pnpm install --prod
      - run: pwsh -File scripts/test-helpers.ps1

  flutter:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --concurrency=1

  ci-ok:
    name: CI passed
    if: always()
    needs: [rust, helpers, flutter]
    runs-on: ubuntu-latest
    steps:
      - name: Require rust and flutter jobs
        run: |
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.helpers.result }}" = "success"
          test "${{ needs.flutter.result }}" = "success"
