name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-windows:
    name: Flutter Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: helpers/crypto-node/pnpm-lock.yaml
      - name: Pack Python / Node helpers
        shell: pwsh
        run: .\scripts\pack-helpers.ps1
      - run: flutter build windows --release
      - name: Copy helpers into app bundle
        shell: pwsh
        run: |
          $src = Join-Path $pwd "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { $src = Join-Path $pwd "build\windows\runner\Release" }
          $dest = Join-Path $src "helpers"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "helpers\dist\crypto-python" (Join-Path $dest "crypto-python") -Recurse -Force
          Copy-Item "helpers\dist\crypto-node" (Join-Path $dest "crypto-node") -Recurse -Force
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          $src = Join-Path $pwd "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) {
            $src = Join-Path $pwd "build\windows\runner\Release"
          }
          if (-not (Test-Path $src)) {
            throw "Flutter Release folder not found"
          }
          $out = Join-Path $pwd "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.2.2' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" "/DSourcePath=$src" "/DOutputDir=$out" "installer\devkit.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: devkit-desktop-windows-amd64.exe
          path: dist/devkit-desktop-windows-amd64.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
