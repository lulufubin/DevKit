name: Automerge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Wait for CI then merge
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Wait for CI and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for CI on $SHA"
          conclusion=""
          for _ in $(seq 1 90); do
            json=$(gh run list --repo "$REPO" --commit "$SHA" --workflow CI --json status,conclusion --limit 5)
            pending=$(printf '%s' "$json" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(printf '%s' "$json" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "startup_failure")] | length')
            succeeded=$(printf '%s' "$json" | jq '[.[] | select(.conclusion == "success")] | length')
            echo "pending=$pending failed=$failed succeeded=$succeeded"
            if [ "$failed" -gt 0 ]; then
              echo "CI failed"
              exit 1
            fi
            if [ "$pending" -eq 0 ] && [ "$succeeded" -gt 0 ]; then
              conclusion="success"
              break
            fi
            sleep 20
          done
          if [ "$conclusion" != "success" ]; then
            echo "Timed out waiting for CI"
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --merge
          # GITHUB_TOKEN 合进 main 不会触发 push 工作流，这里直接打标签并调度图形安装包。
          MAIN_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)
          VER=$(gh api "repos/${REPO}/contents/pubspec.yaml?ref=main" --jq .content | base64 -d | grep -E '^version:' | head -n1 | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          TAG="v${VER}"
          if ! gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${MAIN_SHA}"
            gh workflow run Release --repo "$REPO" --ref "${TAG}"
          fi
