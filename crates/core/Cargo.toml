[package]
name = "devkit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Streaming file operations shared by the DevKit CLI and desktop app"

[dependencies]
age = "0.11"
thiserror = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
urlencoding = "2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
rand = "0.8"
getrandom = { version = "0.4", features = ["sys_rng"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
gmcrypto-core = "1.16"
